          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/YueLiao.app Payload/
          test -x Payload/YueLiao.app/YueLiao
          /usr/bin/ditto -c -k --keepParent Payload YueLiao.ipa
      - uses: actions/upload-artifact@v7
